[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "overlap-engine"
version = "0.1.0"
description = "Standalone cross-bureau overlapping-complaint detection engine (SIH 26264)"
requires-python = ">=3.10"
dependencies = []          # core engine is standard-library only

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
overlap_engine = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
